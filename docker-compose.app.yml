version: "3.8"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentos-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentos

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api

    container_name: agentos-api

    depends_on:
      - postgres

    ports:
      - "5000:5000"

    env_file:
      - ./apps/api/.env

  web:
    build:
      context: ./apps/web

    container_name: agentos-web

    depends_on:
      - api

    ports:
      - "4173:4173"

volumes:
  postgres-data: